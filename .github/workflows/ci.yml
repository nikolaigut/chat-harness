name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: ./backend
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Typecheck with mypy
        working-directory: ./backend
        run: |
          . .venv/bin/activate
          mypy app

      - name: Test with pytest
        working-directory: ./backend
        run: |
          . .venv/bin/activate
          pytest -q

  frontend:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
