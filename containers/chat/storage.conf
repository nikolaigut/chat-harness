# Rootless Podman storage inside the chat container.
# VFS is the safest default for nested, unprivileged Podman.
# For faster builds with fuse-overlayfs, switch the driver and
# run the chat container with --device /dev/fuse.

[storage]
driver = "vfs"
runroot = "/home/chat/.local/share/containers/run"
graphroot = "/home/chat/.local/share/containers/storage"

[storage.options]
ignore_chown_errors = "true"
