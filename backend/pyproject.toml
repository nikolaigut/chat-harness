[project]
name = "chat-harness"
version = "0.1.0"
description = "Multi-agent chat harness with per-chat Podman containers"
requires-python = ">=3.11"
authors = [{ name = "Generated", email = "devin@devin.ai" }]
license = { text = "MIT" }
readme = { text = "Chat Harness backend.", content-type = "text/plain" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.1",
    "aiohttp>=3.11.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.19",
    "jinja2>=3.1.4",
    "numpy>=2.1.3",
    "websockets>=14.1",
    "structlog>=24.4.0",
    "psutil>=6.1.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.3.0",
    "torch>=2.5.1",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = true
ignore_missing_imports = true
